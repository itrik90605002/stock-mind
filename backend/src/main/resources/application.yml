spring:
  application:
    name: warehouse-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/warehouse}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      # Small pool: free-tier Postgres hosts allow few connections.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway migrations
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    # Hibernate logs optimistic-lock conflicts at ERROR before Spring translates them; they are
    # expected under concurrency and retried by StockCommandExecutor, which logs them itself.
    org.hibernate.orm.jdbc.batch: "OFF"

app:
  jwt:
    # Must be >= 32 bytes. ALWAYS override JWT_SECRET in a deployment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-it-must-be-at-least-32-bytes}
    expiration: ${JWT_EXPIRATION:PT12H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  stock:
    max-attempts: 4
    retry-backoff: PT0.05S
    idempotency-retention: P7D
  forecast:
    short-window-days: 30
    long-window-days: 90
    review-period-days: 7
    # z-score for safety stock (1.65 = ~95% service level).
    service-level-z: 1.65
    default-lead-time-days: 7
  ai:
    enabled: ${AI_ENABLED:true}
    # gemini (default model gemini-2.5-flash) or openai (default model gpt-4o-mini).
    provider: ${AI_PROVIDER:gemini}
    # Without a key, AI stays off and the app uses its non-AI fallbacks.
    api-key: ${AI_API_KEY:}
    model: ${AI_CHAT_MODEL:}
    base-url: ${AI_BASE_URL:}
    timeout: ${AI_TIMEOUT:PT30S}
    cooldown: PT1M
    questions-per-minute: ${AI_QUESTIONS_PER_MINUTE:10}
    max-rows: 100
  security:
    login-attempts-per-minute: 10
  demo:
    seed-data: ${DEMO_SEED_DATA:true}
  jobs:
    daily-cron: "0 30 1 * * *"     # 01:30 UTC
    run-on-startup: true           # catches up after the host was asleep
